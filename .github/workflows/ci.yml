name: CI

on:
  pull_request:

jobs:
  verify:
    name: Typecheck, test, media and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script used locally: starts the embedded PostgreSQL, applies
      # migrations, then runs the typechecks, tests, media verification and build.
      - name: Verify
        run: npm run verify
