<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E6A8"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6E14"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7BCFF"/>
      <stop offset="50%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#4B1D7A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="34" r="28" fill="url(#halo)"/>

  <!-- crown prongs -->
  <path d="M26 13.5 28.5 4l4 8.4L36 3l3.4 9 4.1-6.2.9 10.2Z"
        fill="#0D0715" stroke="url(#gold)" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- socketed ring -->
  <circle cx="32" cy="34" r="19.5" fill="#0B0713" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="32" cy="34" r="15.4" fill="none" stroke="#C9A227" stroke-opacity="0.28" stroke-width="0.8"/>

  <!-- six facets -->
  <g stroke="#C9A227" stroke-opacity="0.3" stroke-width="0.7">
    <path d="M32 15.2v37.6M14.6 24.6l34.8 18.8M14.6 43.4l34.8-18.8"/>
  </g>

  <!-- central gem -->
  <polygon points="32,22 41,28.4 41,39.6 32,46 23,39.6 23,28.4"
           fill="url(#gem)" stroke="#F2D472" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="32,26.6 37,30.6 32,34.4 27,30.6" fill="#EDE7F6" fill-opacity="0.45"/>
  <polygon points="32,34.4 37,30.6 41,39.6 32,46" fill="#4B1D7A" fill-opacity="0.55"/>
  <polygon points="27,30.6 32,34.4 32,46 23,39.6" fill="#05030A" fill-opacity="0.35"/>
</svg>
